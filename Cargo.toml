[package]
name = "esp32"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[dependencies]
esp-hal = { version = "~1.2.2", features = ["esp32s3", "log-04"] }
esp-rtos = { version = "0.4.0", features = ["embassy", "esp32s3", "log-04"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3", "log-04"] }
esp-println = { version = "0.18.0", features = ["esp32s3", "log-04"] }
esp-backtrace = { version = "0.20.0", features = ["esp32s3", "panic-handler", "println"] }
log = "0.4.27"

embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time = { version = "0.5.0", features = ["log"] }
static_cell = "2.1.1"
critical-section = "1.2.0"

mipidsi = "0.10.0"
embedded-graphics-core = "0.4.1"
embedded-hal-bus = "0.3.0"
libm = "0.2.11"

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = "fat"
opt-level = "s"
